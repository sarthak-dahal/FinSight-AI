[project]
name = "finsight"
version = "0.1.0"
description = "Local RAG research assistant over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Ingestion (Week 1)
    "requests>=2.32.5",
    "python-dotenv>=1.2.1",
    # Parsing (Week 2)
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    # Retrieval (Week 3)
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "faiss-cpu>=1.15.1",
    "rank-bm25>=0.2.2",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    # LLM (Week 4) — local models via Ollama
    "ollama>=0.6.3",
    # UI (Week 6)
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = ["pytest>=8.4.2"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
